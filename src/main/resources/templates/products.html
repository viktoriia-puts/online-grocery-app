<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>List of products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>

<div class="d-flex justify-content-center mt-3">
    <div class="dropdown me-3">
        <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
            Category
        </button>
        <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
            <li th:each="product : ${products}">
                <a class="dropdown-item" href="#" th:text="${product.category.name}"></a>
            </li>
        </ul>
    </div>
    <div class="input-group mb-3 w-50 me-3">
        <input type="search" id="form1" class="form-control" placeholder="Search by name" />
        <button class="btn btn-primary" type="button">
            <i class="fas fa-search"></i>
        </button>
    </div>
    <div class="input-group" style="width: auto;">
        <button type="button" class="btn btn-outline-primary" style="height: 39px;">
            <i class="bi bi-cart"></i>
            <span id="cartCount" class="badge bg-secondary">0</span>
        </button>
    </div>
</div>


<div class="container">
    <div class="row row-cols-3 g-4">
        <div class="col" th:each="product : ${products}">
            <div class="card h-100">
                <img th:src="${product.imageUrl}" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}"></h5>
                    <p class="card-text" th:text="'price: ' + ${product.price}"></p>
                    <p class="card-text" th:text="'categorty: ' + ${product.category.name}"></p>
                    <p class="card-text" th:text="'quantity: ' + ${product.quantity}"></p>
                </div>
                <div class="card-footer">
                    <a href="#" class="btn btn-primary add-to-cart-btn" th:attr="data-product-id=${product.id}">add to cart</a>
                    <a href="#" class="btn btn-danger remove-from-cart-btn mt-2" th:attr="data-product-id=${product.id}"  style="display: none;">delete from cart</a>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/products.js"></script>
</body>
</html>

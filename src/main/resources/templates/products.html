<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>List of products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="d-flex justify-content-center mt-3">
    <div class="input-group mb-3 w-50">
        <input type="search" id="form1" class="form-control" placeholder="Search by name" />
        <button class="btn btn-primary" type="button">
            <i class="fas fa-search"></i>
        </button>
    </div>
</div>

<div class="container">
    <div class="row row-cols-3 g-4">
        <div class="col" th:each="product : ${products}">
            <div class="card h-100">
                <img th:src="${product.imageUrl}" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}"></h5>
                    <p class="card-text" th:text="'price: ' + ${product.price}"></p>
                    <p class="card-text" th:text="'categorty: ' + ${product.category.name}"></p>
                    <p class="card-text" th:text="'quantity: ' + ${product.quantity}"></p>
                </div>
                <div class="card-footer">
                    <a href="#" class="btn btn-primary">further details</a>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

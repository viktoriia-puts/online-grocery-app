<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-md-12">
            <div class="card shadow-lg" style="border-radius: 15px;">
                <div class="card-header text-center bg-primary text-white" style="font-size: 1.5rem; padding: 1.5rem;">
                    <h3>Your Account</h3>
                </div>
                <div class="card-body" style="padding: 2rem;">
                    <!-- Основная информация пользователя -->
                    <p><strong>Username:</strong> <span th:text="${account.username}"></span></p>
                    <p><strong>Email:</strong> <span th:text="${account.email}"></span></p>

                    <!-- История покупок -->
                    <h5 class="mt-4">Purchase History</h5>

                    <div th:if="${account.orders == null or account.orders.size() == 0}">
                        <p class="text-center text-muted">You have no purchase history yet.</p>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <a href="/products" class="btn btn-primary">Back to Main Page</a>
                </div>
            </div>
        </div>
    </div>
</div></body>
</html>

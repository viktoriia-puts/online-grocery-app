<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kasse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>
<div class="d-flex justify-content-center mt-3 gap-3">
    <h2 class ="mb-4">Please enter your data</h2>
</div>

<div class="container my-4 px-4" >
    <form class="row g-4 needs-validation" id="myForm" action="/kasse" method="post" novalidate>
        <div class="col-md-5  mb-3">
            <label for="validationCustom01" class="form-label mb-3 w-50 mx-4">First name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="validationCustom01" name="firstName" required>
            <div class="invalid-feedback">
                Please provide your first name.
            </div>
        </div>
        <div class="col-md-5  mb-3">
            <label for="validationCustom02" class="form-label mb-3 w-50 mx-4">Last name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="validationCustom02" name="lastName" required>
            <div class="invalid-feedback">
                Please provide your last name.
            </div>
        </div>
        <div class="col-md-5  mb-3">
            <label for="validationCustom03" class="form-label mb-3 w-50 mx-4">City <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="validationCustom03" name="city" required>
            <div class="invalid-feedback">
                Please provide a valid city.
            </div>
        </div>
        <div class="col-md-7  mb-3">
            <label for="validationCustom03" class="form-label mb-3 w-50 mx-4">Adress <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="validationCustom06" name="adress" required>
            <div class="invalid-feedback">
                Please provide a valid adress.
            </div>
        </div>
        <div class="col-md-6  mb-3">
            <label for="validationCustom03" class="form-label mb-3 w-50 mx-4">Telephone <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="validationCustom07" name="telephone" required>
            <div class="invalid-feedback">
                Please provide a valid telephone number.
            </div>
        </div>
        <div class="col-md-3  mb-3">
            <label for="validationCustom04" class="form-label mb-3 w-50 mx-4">State <span class="text-danger">*</span></label>
            <select class="form-select" id="validationCustom04" name="state" required>
                <option selected disabled value="">Choose...</option>
                <option>Austria</option>
                <option>Belgium</option>
                <option>Bulgaria</option>
                <option>Croatia</option>
                <option>Czech Republic</option>
                <option>Denmark</option>
                <option>Estonia</option>
                <option>Finland</option>
                <option>France</option>
                <option>Germany</option>
                <option>Greece</option>
                <option>Hungary</option>
                <option>Ireland</option>
                <option>Italy</option>
                <option>Latvia</option>
                <option>Lithuania</option>
                <option>Luxembourg</option>
                <option>Malta</option>
                <option>Netherlands</option>
                <option>Poland</option>
                <option>Portugal</option>
                <option>Romania</option>
                <option>Slovakia</option>
                <option>Slovenia</option>
                <option>Spain</option>
                <option>Sweden</option>
                <option>United Kingdom</option>
                <option>Iceland</option>
                <option>Norway</option>
                <option>Switzerland</option>
                <option>Liechtenstein</option>
                <option>Andorra</option>
                <option>Monaco</option>
                <option>San Marino</option>
                <option>Vatican City</option>
            </select>
            <div class="invalid-feedback">
                Please select a valid state.
            </div>
        </div>
        <div class="col-md-3  mb-3">
            <label for="validationCustom05" class="form-label mb-3 w-50 mx-4">Zip <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="validationCustom05" name="zip" required>
            <div class="invalid-feedback">
                Please provide a valid zip.
            </div>
        </div>
        <div class="col-12">
            <button class="btn btn-primary d-flex justify-content-center" type="submit">place an order</button>
        </div>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/kasse.js"></script>
</body>
</html>

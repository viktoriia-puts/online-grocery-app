<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-md-12"> <!-- Центрирование карточки -->
            <div class="card shadow-lg" style="border-radius: 15px;">
                <div class="card-header text-center bg-primary text-white" style="font-size: 1.5rem; padding: 1.5rem;">
                    <h3>Your Shopping Cart</h3>
                </div>
                <div class="card-body" style="padding: 2rem;">
                    <!-- Кнопка корзины -->
                    <div class="d-flex justify-content-center gap-3 mb-4">
                        <div class="input-group" style="width: auto;">
                            <a href="/cart" type="button" class="btn btn-outline-primary" style="height: 39px;">
                                <i class="bi bi-cart"></i>
                                <span id="cartCount" class="badge bg-secondary" th:text="${cartCount}">0</span>
                            </a>
                        </div>
                    </div>

                    <!-- Список продуктов -->
                    <div class="container">
                        <div th:each="product : ${products}" class="row mb-3">
                            <div class="col-6" style="max-width: 24rem;">
                                <div class="card h-100">
                                    <img th:src="${product.imageUrl}" class="card-img-top" alt="Product">
                                    <div class="card-body">
                                        <h5 class="card-title" th:text="${product.name}"></h5>
                                        <p class="card-text" th:text="'Price: ' + ${product.price}"></p>
                                        <p class="card-text" th:text="'Category: ' + ${product.category.name}"></p>
                                        <p class="card-text" th:text="'Quantity: ' + ${product.quantity}"></p>
                                    </div>
                                    <div class="card-footer">
                                        <a href="#" class="btn btn-primary add-to-cart-btn" th:attr="data-product-id=${product.id}">+1</a>
                                        <a href="#" class="btn btn-danger remove-from-cart-btn mt-2" th:attr="data-product-id=${product.id}">
                                            Remove
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Сообщение о пустой корзине -->
                    <h2 id="emptyMessage" style="display: none;" class="text-center mt-4">No products added yet</h2>

                    <!-- Кнопка "Place an order" -->
                    <div class="d-flex justify-content-center mt-4 gap-3" id="orderContainer">
                        <a href="/kasse" id="placeOrderButton" type="button" class="btn btn-primary btn-lg" style="width: auto;">Place an Order</a>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <p>Thank you for shopping with us!</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/cart.js"></script>
</body>
</html>
